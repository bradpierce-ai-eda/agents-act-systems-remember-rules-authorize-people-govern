<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="80" y="90" font-family="Arial" font-size="42" font-weight="700" fill="#17233c">Evidence becomes scoped authority</text>
  <text x="80" y="135" font-family="Arial" font-size="22" fill="#53617a">A governed transition issues a capability—not a vague status.</text>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#385985"/></marker></defs>
  <g font-family="Arial">
    <rect x="70" y="280" rx="24" width="210" height="145" fill="#dcecff" stroke="#2d65a3" stroke-width="3"/>
    <text x="175" y="340" text-anchor="middle" font-size="26" font-weight="700" fill="#153f70">PROPOSAL</text><text x="175" y="380" text-anchor="middle" font-size="19" fill="#2e4f72">exact object</text>
    <rect x="330" y="280" rx="24" width="210" height="145" fill="#def6ef" stroke="#26846d" stroke-width="3"/>
    <text x="435" y="340" text-anchor="middle" font-size="26" font-weight="700" fill="#17624f">OBSERVE</text><text x="435" y="380" text-anchor="middle" font-size="19" fill="#2e6156">attributed facts</text>
    <rect x="590" y="280" rx="24" width="210" height="145" fill="#e9f4ff" stroke="#527aa7" stroke-width="3"/>
    <text x="695" y="340" text-anchor="middle" font-size="26" font-weight="700" fill="#294f77">VERIFY</text><text x="695" y="380" text-anchor="middle" font-size="19" fill="#385985">fresh and competent</text>
    <rect x="850" y="280" rx="24" width="210" height="145" fill="#fff0d6" stroke="#c47b12" stroke-width="3"/>
    <text x="955" y="340" text-anchor="middle" font-size="26" font-weight="700" fill="#8a5205">RULE</text><text x="955" y="380" text-anchor="middle" font-size="19" fill="#7a5b2d">named version</text>
    <rect x="1110" y="240" rx="24" width="230" height="225" fill="#fff8e9" stroke="#c47b12" stroke-width="5"/>
    <text x="1225" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#8a5205">GRANT</text>
    <text x="1140" y="330" font-size="18" fill="#6d552e">principal</text><text x="1140" y="358" font-size="18" fill="#6d552e">object digest</text><text x="1140" y="386" font-size="18" fill="#6d552e">operation</text><text x="1240" y="330" font-size="18" fill="#6d552e">policy</text><text x="1240" y="358" font-size="18" fill="#6d552e">expiry</text><text x="1240" y="386" font-size="18" fill="#6d552e">invalidators</text><text x="1140" y="426" font-size="18" fill="#6d552e">evidence digest • one-use / bounded delegation</text>
    <rect x="1390" y="280" rx="24" width="150" height="145" fill="#17233c"/>
    <text x="1465" y="335" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">COMMIT</text><text x="1465" y="375" text-anchor="middle" font-size="18" fill="#d9e5f5">recheck + enforce</text>
  </g>
  <g stroke="#385985" stroke-width="5" marker-end="url(#a)"><line x1="280" y1="352" x2="320" y2="352"/><line x1="540" y1="352" x2="580" y2="352"/><line x1="800" y1="352" x2="840" y2="352"/><line x1="1060" y1="352" x2="1100" y2="352"/><line x1="1340" y1="352" x2="1380" y2="352"/></g>
  <path d="M1465 425 C1465 650 1210 690 955 690 C690 690 435 650 435 435" fill="none" stroke="#26846d" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#a)"/>
  <text x="955" y="735" text-anchor="middle" font-family="Arial" font-size="23" fill="#17624f">Execution and outcome return as new evidence</text>
  <text x="800" y="840" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#17233c">Permission is where facts become power.</text>
</svg>
